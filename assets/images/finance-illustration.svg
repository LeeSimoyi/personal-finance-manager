<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="100%" height="100%" role="img" aria-label="Illustration of a finance dashboard with rising trend line and coins">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2638"/>
      <stop offset="100%" stop-color="#0A1B29"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8FD93A"/>
      <stop offset="100%" stop-color="#BDF75C"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BDF75C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BDF75C" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E8FFB0"/>
      <stop offset="100%" stop-color="#BDF75C"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- floating coin: top right -->
  <g transform="translate(430,80)" filter="url(#softShadow)">
    <circle r="34" fill="url(#coinGrad)"/>
    <text x="0" y="9" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#071724" text-anchor="middle">$</text>
  </g>

  <!-- floating coin: lower left -->
  <g transform="translate(95,420)" filter="url(#softShadow)">
    <circle r="24" fill="url(#coinGrad)" opacity="0.92"/>
    <text x="0" y="7" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#071724" text-anchor="middle">$</text>
  </g>

  <!-- small ring accent -->
  <circle cx="480" cy="330" r="10" fill="none" stroke="#BDF75C" stroke-width="3" opacity="0.55"/>
  <circle cx="70" cy="170" r="6" fill="#BDF75C" opacity="0.5"/>

  <!-- main dashboard card -->
  <g filter="url(#softShadow)">
    <rect x="90" y="150" width="380" height="260" rx="28" fill="url(#cardGrad)" stroke="#1C3A52" stroke-width="1.5"/>

    <!-- card header -->
    <circle cx="128" cy="190" r="9" fill="#BDF75C"/>
    <rect x="148" y="184" width="110" height="11" rx="5.5" fill="#CFE3D8" opacity="0.55"/>
    <rect x="380" y="180" width="60" height="20" rx="10" fill="#BDF75C" opacity="0.18"/>
    <rect x="392" y="186" width="36" height="8" rx="4" fill="#BDF75C" opacity="0.9"/>

    <!-- balance text -->
    <rect x="128" y="216" width="150" height="14" rx="4" fill="#7E92A1" opacity="0.5"/>
    <rect x="128" y="236" width="190" height="26" rx="6" fill="#F2F7EE" opacity="0.92"/>

    <!-- bar chart -->
    <g>
      <rect x="128" y="330" width="22" height="50" rx="5" fill="url(#barGrad)" opacity="0.55"/>
      <rect x="160" y="305" width="22" height="75" rx="5" fill="url(#barGrad)" opacity="0.7"/>
      <rect x="192" y="285" width="22" height="95" rx="5" fill="url(#barGrad)" opacity="0.85"/>
      <rect x="224" y="260" width="22" height="120" rx="5" fill="url(#barGrad)"/>
      <rect x="256" y="295" width="22" height="85" rx="5" fill="url(#barGrad)" opacity="0.75"/>
    </g>

    <!-- ascending trend line over the bars -->
    <path d="M128 360 L165 320 L200 335 L232 270 L268 300 L320 245 L380 215"
          fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="380" cy="215" r="6" fill="#BDF75C"/>
    <circle cx="380" cy="215" r="11" fill="none" stroke="#BDF75C" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- secondary mini card: savings goal -->
  <g filter="url(#softShadow)" transform="translate(330,400)">
    <rect width="170" height="92" rx="20" fill="#0F2638" stroke="#1C3A52" stroke-width="1.5"/>
    <rect x="18" y="18" width="80" height="10" rx="5" fill="#CFE3D8" opacity="0.5"/>
    <rect x="18" y="36" width="50" height="16" rx="5" fill="#F2F7EE" opacity="0.92"/>
    <rect x="18" y="66" width="134" height="8" rx="4" fill="#1C3A52"/>
    <rect x="18" y="66" width="92" height="8" rx="4" fill="#BDF75C"/>
  </g>
</svg>
