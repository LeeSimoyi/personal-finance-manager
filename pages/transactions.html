<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — MoneyFlow</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#071724">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
<div data-app-shell></div>
<main class="app-main" id="main-content">
  <div class="container">

    <div class="page-head">
      <div>
        <p class="eyebrow">Finance Log</p>
        <h1>Transactions</h1>
      </div>
      <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
        <button class="btn btn--primary" id="btnAddIncome"><i data-lucide="plus"></i> Income</button>
        <button class="btn btn--ghost" id="btnAddExpense"><i data-lucide="plus"></i> Expense</button>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="card" style="margin-bottom:var(--space-5);padding:var(--space-4);">
      <div style="display:grid;grid-template-columns:1fr;gap:var(--space-3);" id="filterGrid">
        <div class="search-field">
          <span class="search-field__icon" aria-hidden="true"><i data-lucide="search"></i></span>
          <input type="search" id="searchInput" placeholder="Search by note, category, amount…" aria-label="Search transactions">
        </div>
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
          <select id="filterType" aria-label="Filter by type" style="flex:1 1 120px;">
            <option value="">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filterCategory" aria-label="Filter by category" style="flex:1 1 140px;">
            <option value="">All categories</option>
          </select>
          <input type="month" id="filterMonth" aria-label="Filter by month" style="flex:1 1 160px;">
          <button class="btn btn--ghost btn--sm" id="clearFilters">Clear filters</button>
        </div>
      </div>
    </div>

    <!-- SUMMARY STRIP -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-3);margin-bottom:var(--space-5);" id="summaryStrip"></div>

    <!-- TABLE -->
    <div class="card" style="padding:0;">
      <small class="table-scroll-hint">Scroll to see all columns on mobile</small>
      <div class="table-wrap" style="border:none;">
        <table id="txTable" aria-label="Transaction history">
          <thead>
            <tr>
              <th data-col="date" aria-sort="descending" tabindex="0">Date</th>
              <th data-col="type">Type</th>
              <th data-col="category" tabindex="0">Category</th>
              <th data-col="note" tabindex="0">Note</th>
              <th data-col="amountUSD" tabindex="0" style="text-align:right;">Amount</th>
              <th style="width:100px;">Actions</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border-top:1px solid var(--border);flex-wrap:wrap;gap:var(--space-3);" id="paginationBar">
        <span id="paginationInfo" style="font-size:var(--fs-xs);color:var(--ink-faint);"></span>
        <div style="display:flex;gap:var(--space-2);" id="paginationBtns"></div>
      </div>
    </div>

  </div>
</main>

<!-- ADD/EDIT TRANSACTION MODAL -->
<div class="modal" id="txModal" role="dialog" aria-modal="true" aria-labelledby="txModalTitle" aria-hidden="true">
  <div class="modal__panel">
    <div class="modal__head">
      <h2 id="txModalTitle" style="font-size:var(--fs-lg);margin:0;">Add Transaction</h2>
      <button class="modal__close" data-modal-close aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body">
    <form id="txForm" novalidate>
      <input type="hidden" id="txId">
      <div class="field">
        <label for="txType">Type</label>
        <select id="txType" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="field">
        <label for="txCategory">Category</label>
        <select id="txCategory" required></select>
      </div>
      <div class="input-group">
        <div class="field" style="flex:2">
          <label for="txAmount">Amount</label>
          <input type="number" id="txAmount" min="0.01" step="0.01" placeholder="0.00" required>
        </div>
        <div class="field" style="flex:1">
          <label for="txDate">Date</label>
          <input type="date" id="txDate" required>
        </div>
      </div>
      <div class="field">
        <label for="txNote">Note (optional)</label>
        <input type="text" id="txNote" placeholder="Describe this transaction">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="txRecurring">
        <label for="txRecurring" style="text-transform:none;font-size:var(--fs-sm);color:var(--ink);">Create as recurring</label>
      </div>
      <div id="txRecurringOpts" style="display:none;margin-top:var(--space-3);">
        <div class="field">
          <label for="txFrequency">Frequency</label>
          <select id="txFrequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option></select>
        </div>
      </div>
      <div style="display:flex;gap:var(--space-3);margin-top:var(--space-5);">
        <button type="button" class="btn btn--ghost btn--block" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn--accent btn--block" id="txSaveBtn">Save</button>
      </div>
    </form>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle" aria-hidden="true">
  <div class="modal__panel" style="max-width:380px;">
    <div class="modal__head">
      <h2 id="deleteTitle" style="font-size:var(--fs-lg);margin:0;">Delete transaction?</h2>
      <button class="modal__close" data-modal-close aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body">
      <p>This action cannot be undone.</p>
      <div style="display:flex;gap:var(--space-3);">
        <button class="btn btn--ghost btn--block" data-modal-close>Cancel</button>
        <button class="btn btn--danger btn--block" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/command-palette.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/notifications-engine.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/transactions.js"></script>
</body>
</html>
