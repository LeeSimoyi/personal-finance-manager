<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MoneyFlow</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#071724">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<div class="auth-page">
  <aside class="auth-promo" aria-hidden="true">
    <div class="auth-promo__content">
      <div class="auth-promo__logo" id="promoLogo"></div>
      <h2 class="auth-promo__headline">We'll get you<br><em>back on track</em><br>in seconds.</h2>
      <ul class="auth-promo__feats">
        <li><span class="feat-icon"><i data-lucide="key-round"></i></span> A reset code is shown instantly (demo mode)</li>
        <li><span class="feat-icon"><i data-lucide="shield-check"></i></span> Your financial data stays safe</li>
        <li><span class="feat-icon"><i data-lucide="lock"></i></span> No email required in local-storage mode</li>
      </ul>
    </div>
  </aside>

  <main class="auth-form-panel">
    <div class="auth-card">
      <header class="auth-card__header">
        <div class="auth-card__logo" id="cardLogo"></div>
        <h1 class="auth-card__title" id="formTitle">Reset your password</h1>
        <p class="auth-card__sub" id="formSub">Enter your email and we'll give you a reset code.</p>
      </header>

      <!-- Step 1: request code -->
      <div id="step1">
        <form id="requestForm" novalidate>
          <div class="field" id="reqEmailField">
            <label for="reqEmail">Email address</label>
            <input type="email" id="reqEmail" autocomplete="email" placeholder="Enter Your Email Address" required aria-describedby="reqEmailErr">
            <span class="field-error" id="reqEmailErr" role="alert"></span>
          </div>
          <button type="submit" class="btn btn--accent btn--block">Send reset code</button>
        </form>
      </div>

      <!-- Step 2: enter code + new password -->
      <div id="step2" style="display:none;">
        <div class="demo-code" id="codeDisplay"></div>
        <form id="resetForm" novalidate style="margin-top:var(--space-4);">
          <div class="field" id="codeField">
            <label for="resetCode">6-character reset code</label>
            <input type="text" id="resetCode" placeholder="ABC123" required maxlength="6" style="text-transform:uppercase;letter-spacing:0.2em;" aria-describedby="codeErr">
            <span class="field-error" id="codeErr" role="alert"></span>
          </div>
          <div class="field" id="newPwField">
            <label for="newPassword">New password</label>
            <div class="pw-wrap">
              <input type="password" id="newPassword" placeholder="At least 8 characters" required aria-describedby="newPwErr">
              <button type="button" class="pw-toggle" id="newPwToggle" aria-label="Show password"><i data-lucide="eye"></i></button>
            </div>
            <span class="field-error" id="newPwErr" role="alert"></span>
          </div>
          <button type="submit" class="btn btn--accent btn--block">Set new password</button>
        </form>
      </div>

      <p class="auth-card__footer"><a href="login.html">← Back to sign in</a></p>
    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  Auth.redirectIfLoggedIn();
  document.documentElement.setAttribute('data-theme', localStorage.getItem('mf_last_theme') || 'light');

  document.getElementById('promoLogo').innerHTML = `<span class="logo-mark">${logoMark(30)}</span> MoneyFlow`;
  document.getElementById('cardLogo').innerHTML = `<span class="logo-mark">${logoMark(26)}</span> MoneyFlow`;

  let resetEmail = '';

  // Step 1
  document.getElementById('requestForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('reqEmail').value.trim();
    const field = document.getElementById('reqEmailField');
    const err = document.getElementById('reqEmailErr');
    field.classList.remove('has-error');
    if (!email || !/\S+@\S+\.\S+/.test(email)) {
      field.classList.add('has-error');
      err.textContent = 'Enter a valid email address.';
      return;
    }
    const user = DB.findUserByEmail(email);
    if (!user) {
      field.classList.add('has-error');
      err.textContent = 'No account found with this email.';
      return;
    }
    resetEmail = email;
    const token = DB.createResetToken(email);
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('formTitle').textContent = 'Enter your code';
    document.getElementById('formSub').textContent = 'In a real app this would arrive by email. For this demo, your code is shown below.';
    document.getElementById('codeDisplay').textContent = `Your reset code: ${token}`;
  });

  // PW toggle
  const newPwInput = document.getElementById('newPassword');
  const newPwToggle = document.getElementById('newPwToggle');
  newPwToggle.addEventListener('click', () => {
    const show = newPwInput.type === 'password';
    newPwInput.type = show ? 'text' : 'password';
    newPwToggle.innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}"></i>`;
    refreshIcons();
  });

  // Step 2
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('resetCode').value.trim();
    const newPw = document.getElementById('newPassword').value;
    let valid = true;

    if (!code) { document.getElementById('codeField').classList.add('has-error'); document.getElementById('codeErr').textContent = 'Enter the reset code.'; valid = false; }
    if (!newPw || newPw.length < 8) { document.getElementById('newPwField').classList.add('has-error'); document.getElementById('newPwErr').textContent = 'Password must be at least 8 characters.'; valid = false; }
    if (!valid) return;

    if (!DB.verifyResetToken(resetEmail, code)) {
      document.getElementById('codeField').classList.add('has-error');
      document.getElementById('codeErr').textContent = 'Invalid or expired code.';
      return;
    }

    const user = DB.findUserByEmail(resetEmail);
    await DB.setPassword(user.id, newPw);
    Toast.success('Password updated. Redirecting to login…');
    setTimeout(() => window.location.href = 'login.html', 2000);
  });

  refreshIcons();
})();
</script>
</body>
</html>
